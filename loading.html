<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal SO Cabang - Memuat...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #ffffff;
      overflow: hidden;
      user-select: none;
    }

    .logo-container {
      margin-bottom: 40px;
      animation: fadeInDown 0.8s ease-out;
    }

    .logo-icon {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #e94560, #0f3460);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 8px 32px rgba(233, 69, 96, 0.3);
    }

    .logo-icon svg {
      width: 50px;
      height: 50px;
      fill: #ffffff;
    }

    .app-name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      color: #ffffff;
    }

    .app-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      margin-top: 6px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 1s ease-out 0.3s both;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #e94560;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 20px;
    }

    .loading-text {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 1px;
    }

    .dots {
      display: inline-block;
    }

    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    .progress-bar-container {
      width: 220px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-top: 24px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #e94560, #0f3460);
      border-radius: 3px;
      animation: progress 2.5s ease-in-out infinite;
    }

    .version {
      position: fixed;
      bottom: 18px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 1px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes progress {
      0%   { width: 0%; margin-left: 0; }
      50%  { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes dots {
      0%  { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-icon">
      <!-- Ikon toko / store sederhana -->
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 24l4-16h40l4 16H8z"/>
        <rect x="10" y="24" width="44" height="28" rx="2"/>
        <rect x="24" y="36" width="16" height="16" rx="2" fill="rgba(255,255,255,0.3)"/>
        <rect x="12" y="30" width="12" height="10" rx="1" fill="rgba(255,255,255,0.3)"/>
        <rect x="40" y="30" width="12" height="10" rx="1" fill="rgba(255,255,255,0.3)"/>
      </svg>
    </div>
    <div class="app-name">Portal SO Cabang</div>
    <div class="app-subtitle">Sales Order Management</div>
  </div>

  <div class="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">
      Memuat aplikasi<span class="dots"></span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>
  </div>

  <div class="version" id="version">v1.0.0</div>

  <script>
    // Tampilkan versi dari URL param jika ada
    try {
      const params = new URLSearchParams(window.location.search);
      const ver = params.get('v');
      if (ver) document.getElementById('version').textContent = 'v' + ver;
    } catch (e) {}
  </script>
</body>
</html>
