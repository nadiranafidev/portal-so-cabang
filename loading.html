<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal SO Cabang</title>
  <style>
    :root {
      --bg: #0f1117;
      --accent: #3b82f6;
      --accent-dim: rgba(59, 130, 246, 0.15);
      --text: #f1f5f9;
      --text-muted: rgba(241, 245, 249, 0.4);
      --text-sub: rgba(241, 245, 249, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: var(--text);
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* ── Wrapper utama ── */
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.1s forwards;
    }

    /* ── Ikon ── */
    .icon-wrap {
      width: 72px;
      height: 72px;
      background: var(--accent-dim);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      box-shadow: 0 0 32px rgba(59, 130, 246, 0.12);
    }

    .icon-wrap svg {
      width: 36px;
      height: 36px;
    }

    /* ── Teks ── */
    .app-name {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text);
      margin-bottom: 4px;
      text-align: center;
    }

    .app-sub {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 44px;
    }

    /* ── Progress bar indeterminate ── */
    .bar-track {
      width: 180px;
      height: 2px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .bar-fill {
      height: 100%;
      width: 45%;
      background: var(--accent);
      border-radius: 2px;
      animation: slide 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* ── Status teks ── */
    .status {
      font-size: 12px;
      color: var(--text-sub);
      letter-spacing: 0.03em;
      min-height: 16px;
      text-align: center;
    }

    /* ── Versi ── */
    .version {
      position: fixed;
      bottom: 20px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.18);
      letter-spacing: 0.05em;
    }

    /* ── Fade-out saat transisi ke website ── */
    body.fade-out {
      animation: fadeOut 0.3s ease-out forwards;
    }

    /* ── Keyframes ── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slide {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(280%); }
    }

    @keyframes fadeOut {
      to { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- Ikon SO / Sales Order -->
    <div class="icon-wrap">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Dokumen -->
        <rect x="6" y="4" width="20" height="26" rx="3" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="1.5"/>
        <!-- Garis teks -->
        <line x1="10" y1="12" x2="22" y2="12" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="10" y1="17" x2="22" y2="17" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="10" y1="22" x2="17" y2="22" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Centang kecil di pojok kanan bawah -->
        <circle cx="27" cy="27" r="6" fill="#0f1117"/>
        <circle cx="27" cy="27" r="5.5" stroke="#22c55e" stroke-width="1"/>
        <polyline points="24.5,27 26.5,29 30,24.5" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>

    <div class="app-name">Portal SO Cabang</div>
    <div class="app-sub">Sales Order Management</div>

    <div class="bar-track">
      <div class="bar-fill"></div>
    </div>

    <div class="status" id="status">Menghubungkan ke server</div>
  </div>

  <div class="version" id="version">v1.0.0</div>

  <script>
    // Versi dari URL param
    try {
      const p = new URLSearchParams(window.location.search);
      const v = p.get('v');
      if (v) document.getElementById('version').textContent = 'v' + v;
    } catch (_) {}

    // Rotasi teks status agar terasa hidup
    const statusEl = document.getElementById('status');
    const messages = [
      'Menghubungkan ke server',
      'Memuat konfigurasi',
      'Menyiapkan sesi',
      'Sebentar lagi siap'
    ];
    let idx = 0;
    const interval = setInterval(() => {
      idx = (idx + 1) % messages.length;
      statusEl.style.opacity = '0';
      statusEl.style.transition = 'opacity 0.25s';
      setTimeout(() => {
        statusEl.textContent = messages[idx];
        statusEl.style.opacity = '1';
      }, 260);
    }, 2200);

    // Ekspos fungsi fade-out untuk dipanggil dari main process via IPC
    // (dipanggil oleh renderer sebelum window disembunyikan)
    window.__fadeOut = function () {
      clearInterval(interval);
      document.body.classList.add('fade-out');
    };
  </script>
</body>
</html>
